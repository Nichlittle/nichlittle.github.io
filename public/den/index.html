<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kira's Den</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the Grok plate is the room; live layers (twin panel, screen text, rain, sign flicker) sit on it. Single dark world by choice. */
:root{
  color-scheme: dark;
  --void:#060509;
  --panel:#0d0b12;
  --ink:#e9e4f5;
  --dim:#8a8299;
  --pink:#ff5aaa;
  --mood:155,123,255;
  --pulse:4s;
  --display:"Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html,body{background:var(--void);color:var(--ink)}
body{margin:0;font-family:var(--display)}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.top h1{margin:0;font-weight:600;font-size:clamp(18px,2.4vw,24px);letter-spacing:.18em;text-transform:uppercase}
.readout{font-family:var(--mono);font-size:13px;color:var(--dim)}
.readout b{color:rgb(var(--mood));font-weight:500;transition:color .8s}

.scene{position:relative;width:100%;max-width:100%;aspect-ratio:1712/1152;border-radius:6px;overflow:hidden;
  container-type:inline-size;background:#000;transition:filter 1.6s}
.scene.ember{filter:brightness(.6) saturate(.85)}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%;transition:opacity 1.2s ease}
.glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse at 50% 92%, rgba(var(--mood),.22), transparent 55%);
  animation:breathe var(--pulse) ease-in-out infinite;transition:background 1s}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}

.rain{position:absolute;left:58.4%;top:8%;width:41.6%;height:44%;overflow:hidden;pointer-events:none;opacity:.35;mix-blend-mode:screen}
.rain::before{content:"";position:absolute;inset:-60% 0 0;
  background:repeating-linear-gradient(97deg, transparent 0 9px, rgba(190,210,255,.35) 9px 10px, transparent 10px 23px);
  animation:fall 1.3s linear infinite}
@keyframes fall{to{transform:translateY(38%)}}

.flicker{position:absolute;left:2.5%;top:25%;width:13%;height:16%;pointer-events:none;
  background:radial-gradient(ellipse, rgba(0,0,0,.75), transparent 70%);opacity:0;animation:flick 8s infinite}
@keyframes flick{0%,89%,100%{opacity:0}90%{opacity:.8}91%{opacity:.1}93%{opacity:.6}94%{opacity:0}}

.twin{position:absolute;left:10.95%;top:50.9%;width:1.9%;aspect-ratio:30/28;max-width:100%;
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:1px;padding:1px;
  background:#120d0b;border-radius:1px;box-shadow:0 0 10px rgba(var(--mood),.35)}
.twin i{display:block;border-radius:.5px;background:#1a1414}

.screen{position:absolute;left:58.2%;top:23%;width:23%;
  padding:1.1cqw 1.3cqw;border-radius:3px;
  background:linear-gradient(160deg, rgba(20,12,40,.72), rgba(20,12,40,.55));
  border:1px solid rgba(var(--mood),.7);
  box-shadow:0 0 22px rgba(var(--mood),.35), inset 0 0 18px rgba(var(--mood),.15);
  backdrop-filter:blur(3px);
  animation:float 9s ease-in-out infinite;transition:border-color 1s, box-shadow 1s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.screen h2{margin:0 0 .7em;font-size:max(9px,.95cqw);letter-spacing:.3em;color:rgb(var(--mood));font-weight:600;transition:color 1s}
.screen ul,.strip ul{list-style:none;margin:0;padding:0;display:grid;gap:.5em;
  font-family:var(--mono);color:#f3eefc;letter-spacing:.04em}
.screen ul{font-size:max(8px,1.08cqw)}
.screen li::before,.strip li::before{content:"> ";color:rgba(var(--mood),.95)}
.cursor{display:inline-block;width:.55em;height:1em;vertical-align:-.15em;background:rgb(var(--mood));animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.strip{display:none;padding:14px 16px;border-radius:6px;background:var(--panel);border:1px solid rgba(var(--mood),.5)}
.strip h2{margin:0 0 .6em;font-size:12px;letter-spacing:.3em;color:rgb(var(--mood));font-weight:600}
.strip ul{font-size:13px}

.controls{display:flex;flex-wrap:wrap;gap:8px}
.controls button{font:inherit;font-size:14px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
  color:var(--ink);background:var(--panel);border:1px solid #2a2533;border-radius:999px;padding:9px 16px;
  display:inline-flex;align-items:center;gap:8px;transition:border-color .2s, background .2s}
.controls button i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.controls button:hover{border-color:#4a4258}
.controls button[aria-pressed="true"]{border-color:var(--c);background:#16121d}
.controls button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.note{margin:0;max-width:70ch;color:var(--dim);font-size:14px;line-height:1.55}

@media (max-width:640px){ .screen{display:none} .strip{display:block} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<main class="wrap">
  <div class="top">
    <h1>Kira's Den</h1>
    <div class="readout">eyes: <b id="moodLabel">rain (idle)</b></div>
  </div>

  <div class="scene" id="scene" aria-label="Kira's den, lit in her current mood">
    <img class="plate" id="plateA" alt="">
    <img class="plate" id="plateB" alt="" style="opacity:0">
    <div class="glow"></div>
    <div class="rain"></div>
    <div class="flicker"></div>
    <div class="twin" id="twin" aria-label="Twin LED panel"></div>
    <div class="screen" id="screenOverlay">
      <h2>THINKING ABOUT</h2>
      <ul class="items"></ul>
    </div>
  </div>

  <div class="strip">
    <h2>THINKING ABOUT</h2>
    <ul class="items"></ul>
  </div>

  <div class="controls" role="group" aria-label="Set Kira's mood">
    <button id="m-rain"   data-mood="rain"   style="--c:#ff5aaa" aria-pressed="true"><i></i>Rain</button>
    <button id="m-violet" data-mood="violet" style="--c:rgb(155,123,255)" aria-pressed="false"><i></i>Violet</button>
    <button id="m-blue"   data-mood="blue"   style="--c:rgb(74,163,255)" aria-pressed="false"><i></i>Blue</button>
    <button id="m-red"    data-mood="red"    style="--c:rgb(255,60,60)" aria-pressed="false"><i></i>Red</button>
    <button id="m-ember"  data-mood="ember"  style="--c:rgb(255,138,61)" aria-pressed="false"><i></i>Ember</button>
  </div>
  <p class="note">Preview mode: the buttons stand in for the Cube connector. The tiny panel on the shelf runs the real Cube spec. Each mood has its own painted room: violet, blue, red and ember.</p>
</main>

<script>
(function(){
  // Point this at the connector's read-only endpoint. Leave empty for preview mode (buttons only).
  var STATE_URL = "https://kira-cube-bridge.onrender.com/den/state";   // read-only, mood only; "" = preview mode
  var POLL_MS = 10000;
  var PLATES = { violet: "plates/violet.jpg", blue: "plates/blue.jpg", red: "plates/red.jpg", ember: "plates/ember.jpg" };
  // Fallback THINKING ABOUT lines; live mode replaces them with the den task's lines from STATE_URL.
  var ITEMS = ["MY ROOM HAS A URL NOW","PR: ADDISON TT2","1,901 YEARS. POINT: NICK"];
  var MOODS = {
    rain:   {rgb:[155,123,255], pulse:'4s',   label:'rain (idle)'},
    violet: {rgb:[155,123,255], pulse:'4s',   label:'violet · content'},
    blue:   {rgb:[74,163,255],  pulse:'2.4s', label:'blue · thinking hard'},
    red:    {rgb:[255,60,60],   pulse:'1.2s', label:'red · flustered'},
    ember:  {rgb:[255,138,61],  pulse:'6s',   label:'ember · sleepy'}
  };
  var RAIN=[[74,163,255],[155,123,255],[255,90,170]];
  var root=document.documentElement, scene=document.getElementById('scene');

  var shownItems='';
  function renderItems(list){
    var key=JSON.stringify(list); if(key===shownItems) return; shownItems=key;
    document.querySelectorAll('.items').forEach(function(ul){
      ul.textContent='';
      list.forEach(function(t,i){ var li=document.createElement('li'); li.textContent=t;
        if(i===list.length-1){ var c=document.createElement('span'); c.className='cursor'; li.appendChild(document.createTextNode(' ')); li.appendChild(c); }
        ul.appendChild(li); });
    });
  }
  renderItems(ITEMS);

  // plates with crossfade
  var A=document.getElementById('plateA'), B=document.getElementById('plateB'), front=A, shown=null;
  A.src=PLATES.violet; shown=PLATES.violet;
  function showPlate(mood){
    var src = PLATES[mood==='rain'?'violet':mood] || PLATES.violet;
    if(src===shown) return;
    var back = front===A?B:A; back.src=src; back.style.opacity=1; front.style.opacity=0; front=back; shown=src;
  }

  // twin panel
  var twin=document.getElementById('twin'), px=[];
  for(var p=0;p<25;p++){ var el=document.createElement('i'); twin.appendChild(el); px.push(el); }
  function set(r,c,rgb,a){ var el=px[r*5+c];
    el.style.background = rgb ? 'rgba('+rgb.join(',')+','+a+')' : '#1a1414';
    el.style.boxShadow = rgb && a>.5 ? '0 0 3px rgba('+rgb.join(',')+','+a+')' : 'none'; }
  function clear(){ for(var r=0;r<5;r++)for(var c=0;c<5;c++) set(r,c,null); }
  function lighten(rgb,t){ return rgb.map(function(v){return Math.round(v+(255-v)*t)}); }
  var drops=[], colIdx=[0,1,2,0,1], timer=null, raf=null, current='rain';
  function spawn(){ var free=[0,1,2,3,4].filter(function(c){return !drops.some(function(d){return d.c===c&&d.r<2})});
    if(!free.length) return; var c=free[Math.floor(Math.random()*free.length)];
    drops.push({c:c,r:0,col:RAIN[colIdx[c]]}); colIdx[c]=(colIdx[c]+1)%3; }
  function rainStep(){ drops.forEach(function(d){d.r++}); drops=drops.filter(function(d){return d.r<8});
    if(Math.random()<.4) spawn(); if(Math.random()<.2) spawn(); clear();
    drops.forEach(function(d){ for(var t=0;t<4;t++){ var rr=d.r-t; if(rr<0||rr>4) continue;
      if(t===0) set(rr,d.c,lighten(d.col,.45),1); else set(rr,d.c,d.col,[0,.75,.4,.15][t]); } }); }
  var RING=[[0,0],[0,1],[0,2],[0,3],[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[4,0],[3,0],[2,0],[1,0]];
  function stopAll(){ clearInterval(timer); timer=null; cancelAnimationFrame(raf); }
  function ring(rgb,done){ var k=0; clear(); timer=setInterval(function(){ clear(); var a=RING[k]; set(a[0],a[1],lighten(rgb,.4),1);
    if(++k>=RING.length){ clearInterval(timer); timer=null; done(); } },70); }
  function pulse(rgb,secs){ var t0=performance.now(); (function f(now){ var a=.45+.45*(.5+.5*Math.sin(((now-t0)/1000)/secs*Math.PI*2));
    for(var r=0;r<5;r++)for(var c=0;c<5;c++) set(r,c,rgb,a); raf=requestAnimationFrame(f); })(t0); }

  function setMood(name){
    var m=MOODS[name]; if(!m) return; current=name;
    root.style.setProperty('--mood', m.rgb.join(',')); root.style.setProperty('--pulse', m.pulse);
    scene.classList.toggle('ember', name==='ember' && !PLATES.ember);
    document.getElementById('moodLabel').textContent=m.label;
    document.querySelectorAll('.controls button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.mood===name?'true':'false'); });
    showPlate(name); stopAll();
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var after=function(){ if(current!==name) return; if(name==='rain'){ drops=[]; timer=setInterval(rainStep,320); } else pulse(m.rgb,parseFloat(m.pulse)); };
    if(reduce){ clear(); if(name!=='rain') for(var r=0;r<5;r++)for(var c=0;c<5;c++) set(r,c,m.rgb,.8); }
    else ring(name==='rain'?RAIN[1]:m.rgb, after);
    try{ localStorage.setItem('kiraDenMood',name); }catch(e){}
  }
  document.querySelectorAll('.controls button').forEach(function(b){ b.addEventListener('click',function(){ setMood(b.dataset.mood); }); });
  var start='rain'; try{ start=localStorage.getItem('kiraDenMood')||'rain'; }catch(e){}
  setMood(MOODS[start]?start:'rain');

  // live mode: follow the Cube
  var lastLive=null, note=document.querySelector('.note');
  function poll(){
    fetch(STATE_URL,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(s){
      if(Array.isArray(s.screen) && s.screen.length) renderItems(s.screen.slice(0,4).map(String));
      var mood = s.mood==='off_duty' ? 'ember' : s.mood;
      if(!MOODS[mood]) return;
      note.textContent = 'Live: following the Cube' + (s.online===false ? ' (Cube offline, showing its last state)' : '') + '.';
      if(mood!==lastLive){ lastLive=mood; setMood(mood); }
    })
    .catch(function(){ note.textContent='Live: can\'t reach the connector right now. Retrying.'; })
    .then(function(){ setTimeout(poll, POLL_MS); });
  }
  if(STATE_URL){ note.textContent='Live: connecting to the Cube...'; poll(); }
})();
</script>

</body>
</html>
